name: Format Dump

on:
  pull_request:
    branches: [main]

jobs:
  format-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Format Skills
        run: npx prettier --write src/components/sections/Skills.astro
      - name: Dump formatted file
        run: |
          echo '---FORMATTED-SKILLS-BASE64---'
          base64 -w0 src/components/sections/Skills.astro
          echo
          echo '---END-FORMATTED-SKILLS-BASE64---'
