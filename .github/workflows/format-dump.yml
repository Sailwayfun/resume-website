name: Format Dump

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Format Skills
        run: npx prettier --write src/components/sections/Skills.astro
      - name: Commit formatted Skills
        run: |
          if git diff --quiet -- src/components/sections/Skills.astro; then
            echo "Skills.astro already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/sections/Skills.astro
          git commit -m "chore: format skills component"
          git push origin HEAD:${{ github.head_ref }}
